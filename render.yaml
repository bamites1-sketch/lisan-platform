services:
  - type: web
    name: lisan-backend
    runtime: node
    region: oregon
    plan: starter
    branch: main
    rootDir: readpath-backend
    buildCommand: cp prisma/schema.production.prisma prisma/schema.prisma && npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: lisan-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://readpath-frontend.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: SETUP_KEY
        sync: false
      # ── File storage (Cloudflare R2) ─────────────────────────────────────────
      # Optional: app works without these — file uploads are skipped gracefully.
      # Add these later in the Render dashboard when you set up Cloudflare R2.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: lisan-storage
      - key: R2_ENDPOINT
        sync: false

databases:
  - name: lisan-db
    databaseName: lisan
    user: lisan
    region: oregon
    plan: starter
