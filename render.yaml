services:
  - type: web
    name: lisan-api
    runtime: node
    rootDir: readpath-backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: ""
      - key: JWT_SECRET
        value: readpath-super-secret-jwt-key-2026
      - key: JWT_REFRESH_SECRET
        value: readpath-super-secret-refresh-key-2026-different
      - key: GEMINI_API_KEY
        value: AIzaSyAb8RN6J0-JOXIaheRy8WP1s4bNw8-KGA37lvCPahwq5KjPFIug
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
