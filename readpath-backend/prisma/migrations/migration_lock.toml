# Please do not edit this file manually
# It should be added in your version-control system (i.e. Git)
#
# NOTE: This lock must match the DATASOURCE provider in the production schema,
# which is `postgresql` (see prisma/schema.production.prisma).
# Dev schema (prisma/schema.prisma) historically used sqlite; keep the lock
# aligned with the production schema so `prisma migrate deploy` works on
# hosted PostgreSQL instances (Render / Back4App / Vercel Postgres / etc).
provider = "postgresql"