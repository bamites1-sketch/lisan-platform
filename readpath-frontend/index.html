  <body class="bg-[#f8faf9] text-gray-900 selection:bg-[#d4a017]/30 selection:text-[#1a3a2a]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Professional Service Worker registration with instant update handling
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            // Check for updates periodically
            registration.addEventListener('updatefound', () => {
              const installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.addEventListener('statechange', () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('LiSAN: New version available.');
                  }
                });
              }
            });
          }).catch((err) => {
            console.warn('LiSAN ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
