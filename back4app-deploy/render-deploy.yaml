services:
  - type: web
    name: readpath-backend-fixed
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./production.db
      - key: FRONTEND_URL
        value: https://readpath-frontend.vercel.app
