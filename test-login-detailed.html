<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <style>
        body { font-family: system-ui; padding: 40px; max-width: 600px; margin: 0 auto; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #2d6a4f; color: white; border: none; border-radius: 8px; }
        button:hover { background: #1a3a2a; }
        .result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f5f5f5; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        pre { white-space: pre-wrap; word-wrap: break-word; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🔐 ReadPath Login Test</h1>
    <p>Testing login to: <code>https://readpathbackend-fm8jnxat.b4a.run</code></p>
    
    <div>
        <label>Email:</label><br>
        <input type="email" id="email" value="admin@readpath.com" style="width: 100%; padding: 8px; margin: 8px 0; font-size: 14px;">
    </div>
    
    <div>
        <label>Password:</label><br>
        <input type="password" id="password" value="admin123456" style="width: 100%; padding: 8px; margin: 8px 0; font-size: 14px;">
    </div>
    
    <button onclick="testLogin()">Test Login</button>
    
    <div id="result"></div>
    
    <script>
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<div class="result">Testing... ⏳</div>';
            
            try {
                const url = 'https://readpathbackend-fm8jnxat.b4a.run/api/auth/login';
                console.log('Calling:', url);
                console.log('Body:', JSON.stringify({ email, password }));
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('Invalid JSON response: ' + text.substring(0, 100));
                }
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Login Successful!</h3>
                            <p><strong>User:</strong> ${data.data.user.email}</p>
                            <p><strong>Role:</strong> ${data.data.user.role}</p>
                            <p><strong>Token:</strong> ${data.data.token.substring(0, 30)}...</p>
                            <details>
                                <summary>Full Response</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Login Failed</h3>
                            <p><strong>Message:</strong> ${data.message || 'Unknown error'}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                        <p>Check the browser console for more details (F12)</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
